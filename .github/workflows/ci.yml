name: Simple CI test workflow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-lint:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack (for pnpm)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create .env and append DATABASE_UTL
        working-directory: apps/api
        run: echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" > .env

      - name: Lint
        run: pnpm -r lint

      - name: Build web app
        run: pnpm --filter web build

      - name: Build api app
        run: pnpm --filter api build